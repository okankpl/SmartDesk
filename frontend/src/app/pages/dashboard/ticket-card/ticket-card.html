<article class="ticket-card">
  <div class="ticket-card__header">
    <h3>{{ ticket().title }}</h3>
    <span class="ticket-card__status ticket-card__status--{{ ticket().status }}">
      {{ statusLabel() }}
    </span>
  </div>

  <span class="ticket-card__priority ticket-card__priority--{{ ticket().priority }}">
    {{ priorityLabel() }}
  </span>
</article>
