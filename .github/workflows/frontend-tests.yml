name: Frontend Tests

# Eigene Workflow-Datei statt eines zweiten Jobs in backend-tests.yml - beide
# laufen unabhaengig voneinander (ein kaputter Frontend-Test blockiert nicht
# den Backend-Job und umgekehrt), gleiches Prinzip wie die Trennung der
# beiden Anwendungen selbst (siehe docs/architektur-und-konzepte.md,
# Abschnitt 1: Client-Server-Architektur).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Alle "run"-Schritte starten automatisch im frontend/-Ordner, gleiches
    # Prinzip wie "working-directory: backend" in backend-tests.yml.
    defaults:
      run:
        working-directory: frontend

    steps:
      # @v7 statt @v4: die v4-Versionen laufen intern noch auf Node 20, das
      # GitHub als veraltet markiert (Warnung in jedem Lauf).
      - uses: actions/checkout@v7

      - name: Node installieren
        uses: actions/setup-node@v7
        with:
          # Die Node-Version steht an EINER Stelle, in frontend/.nvmrc - auch
          # scripts/deploy.sh liest sie von dort. Vorher stand hier fest "20":
          # Angular 22 verlangt aber mindestens Node 22.22/24.15 und bricht
          # unter Node 20 sofort mit Exit-Code 3 ab - jeder Lauf dieses
          # Workflows war deshalb rot, ohne dass ein einziger Test lief.
          node-version-file: frontend/.nvmrc
          # Cached node_modules zwischen CI-Laeufen (ueber den Inhalt von
          # package-lock.json identifiziert) - macht spaetere Laeufe
          # deutlich schneller, weil npm ci nicht jedes Mal alles neu
          # herunterladen muss.
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci statt npm install: installiert EXAKT die in package-lock.json
      # fixierten Versionen und bricht ab, falls package.json und
      # package-lock.json nicht zueinander passen - reproduzierbarer als
      # npm install, das Lockfile-Versionen bei Bedarf stillschweigend
      # aktualisieren wuerde. Genau die Art von Versions-Ungenauigkeit, die
      # beim Backend (requirements.txt ohne exakte Versionen) als bewusste
      # Einschraenkung dokumentiert ist - beim Frontend dank package-lock.json
      # von Anfang an sauber geloest.
      - name: Abhaengigkeiten installieren
        run: npm ci

      # --watch=false: einmal laufen und mit Erfolg/Fehler beenden, statt (wie
      # lokal bei "npm test") auf Datei-Aenderungen zu warten.
      - name: Tests ausfuehren
        run: npx ng test --watch=false

      # Der Produktions-Build prueft mehr als die Tests: Template-Typfehler in
      # allen Komponenten und die Groessen-Budgets aus angular.json (z.B. max.
      # 4 kB Styles pro Komponente) - genau das, was beim Deployment sonst
      # erst auf dem Server auffallen wuerde.
      - name: Produktions-Build pruefen
        run: npx ng build
