name: Demo & Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser-Abhaengigkeiten installieren
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frische Demo bauen und starten
        run: docker compose -f docker-compose.demo.yml up -d --build --wait
      - name: Desktop und Mobile testen
        working-directory: frontend
        run: npm run test:e2e
      - name: Fehlerdiagnose
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Container stoppen
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
