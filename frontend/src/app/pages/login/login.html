<div class="login-page">
  <div class="auth-shell">
    <a class="brand" routerLink="/login"><span class="brand-mark"><svg lucideTicketCheck [size]="22"></svg></span>SmartDesk</a>
    <form class="login-card" (submit)="submit($event)">
      <h1>Anmelden</h1>
      @if (accountCreated) { <p class="info" role="status">Dein Konto wurde erstellt. Du kannst dich jetzt anmelden.</p> }
      @if (sessionExpired) { <p class="info" role="status">Deine Sitzung ist abgelaufen. Bitte melde dich erneut an.</p> }
      <div class="field"><label for="login-email">E-Mail</label><input id="login-email" name="email" type="email" placeholder="name@unternehmen.de" [value]="email()" (input)="onEmailInput($event)" required autocomplete="email" /></div>
      <div class="field"><label for="login-password">Passwort</label><div class="password-field">
        <input id="login-password" name="password" [type]="passwordVisible() ? 'text' : 'password'" [value]="password()" (input)="onPasswordInput($event)" required autocomplete="current-password" />
        <button type="button" class="password-toggle" [attr.aria-label]="passwordVisible() ? 'Passwort verbergen' : 'Passwort anzeigen'" [title]="passwordVisible() ? 'Passwort verbergen' : 'Passwort anzeigen'" [attr.aria-pressed]="passwordVisible()" (click)="passwordVisible.set(!passwordVisible())">@if (passwordVisible()) { <svg lucideEyeOff [size]="17"></svg> } @else { <svg lucideEye [size]="17"></svg> }</button>
      </div></div>
      @if (errorMessage()) { <p class="error" role="alert">{{ errorMessage() }}</p> }
      <button type="submit" class="button button--primary auth-submit" [disabled]="isSubmitting() || retryAfterSeconds() > 0">{{ isSubmitting() ? 'Wird geprüft…' : retryAfterSeconds() > 0 ? 'Erneut in ' + retryAfterSeconds() + ' s' : 'Anmelden' }}<svg lucideArrowRight [size]="17"></svg></button>
      <p class="auth-link">Noch kein Konto? <a routerLink="/register">Registrieren</a></p>
    </form>
  </div>
</div>
