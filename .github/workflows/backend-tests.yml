name: Backend Tests

# Loest diesen Workflow bei jedem Push und bei jedem Pull Request auf den
# main-Branch aus. Laeuft auf GitHubs eigenen Servern, nicht bei dir lokal.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d smartdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Alle "run"-Schritte starten automatisch im backend/-Ordner, damit wir
    # nicht jedes Mal "cd backend &&" davorschreiben muessen.
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/smartdesk_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/smartdesk_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      LOGIN_RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      # Laedt den Repo-Inhalt in die virtuelle Maschine, die diesen Job ausfuehrt.
      # @v7: die aelteren Versionen laufen intern noch auf dem von GitHub als
      # veraltet markierten Node 20 (siehe frontend-tests.yml).
      - uses: actions/checkout@v7

      - name: Python installieren
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Statische Pruefung
        run: ruff check .

      - name: Migrationen und Modelldrift pruefen
        run: |
          alembic upgrade head
          alembic check

      - name: Tests ausfuehren
        run: pytest -v
