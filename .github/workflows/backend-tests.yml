name: Backend Tests

# Loest diesen Workflow bei jedem Push und bei jedem Pull Request auf den
# main-Branch aus. Laeuft auf GitHubs eigenen Servern, nicht bei dir lokal.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Alle "run"-Schritte starten automatisch im backend/-Ordner, damit wir
    # nicht jedes Mal "cd backend &&" davorschreiben muessen.
    defaults:
      run:
        working-directory: backend
    env:
      # Unsere Tests brauchen keine echte Datenbankverbindung (nur die
      # Settings-Klasse verlangt, dass die Variable ueberhaupt gesetzt ist).
      # Kein echtes Geheimnis, nur ein Platzhalter fuer den CI-Lauf.
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      # Laedt den Repo-Inhalt in die virtuelle Maschine, die diesen Job ausfuehrt.
      # @v7: die aelteren Versionen laufen intern noch auf dem von GitHub als
      # veraltet markierten Node 20 (siehe frontend-tests.yml).
      - uses: actions/checkout@v7

      - name: Python installieren
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tests ausfuehren
        run: pytest -v
