<!doctype html>
<!-- lang="de": sagt Browsern und Screenreadern, in welcher Sprache die Seite
     geschrieben ist. Mit "en" lasen Screenreader die deutschen Texte mit
     englischer Aussprache vor, und die automatische Silbentrennung/
     Rechtschreibpruefung arbeitete mit der falschen Sprache. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SmartDesk</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
