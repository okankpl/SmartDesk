services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # "127.0.0.1:" davor: Port nur auf dem eigenen Rechner erreichbar. Ohne
    # diese Angabe oeffnet Docker ihn auf ALLEN Netzwerkschnittstellen - im
    # selben WLAN (Uni, Cafe) koennte dann jeder die Datenbank mit dem
    # Standard-Passwort aus .env.example erreichen. Docker umgeht dabei unter
    # Umstaenden sogar die Firewall des Betriebssystems.
    # Zwei Eintraege: 127.0.0.1 ist die lokale IPv4-, [::1] die lokale
    # IPv6-Adresse - beide nur vom eigenen Rechner aus erreichbar. Nur mit
    # 127.0.0.1 probiert Windows bei "localhost" zuerst vergeblich [::1] und
    # faellt erst danach auf IPv4 zurueck (gemessen: 0,2 s pro Verbindung im
    # Browser/curl, rund 2 s in Python).
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      # Bind-Mount für Live-Reload: Codeänderungen wirken sofort, ohne Rebuild.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
