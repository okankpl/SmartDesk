<a class="skip-link" href="#main-content">Zum Inhalt</a>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="SmartDesk Dashboard">
      <span class="brand-mark"><svg lucideTicketCheck [size]="21"></svg></span>
      <span>SmartDesk</span>
    </a>
    <nav class="navigation" aria-label="Hauptnavigation">
      <span class="nav-label">Arbeitsplatz</span>
      <a routerLink="/dashboard" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" routerLinkActive="active" title="Dashboard">
        <svg lucideLayoutDashboard [size]="18"></svg><span>Dashboard</span>
      </a>
      <a routerLink="/tickets/new" routerLinkActive="active" ariaCurrentWhenActive="page" title="Neues Ticket">
        <svg lucideCirclePlus [size]="18"></svg><span>Neues Ticket</span>
      </a>
    </nav>
    <div class="sidebar-footer"><svg lucideHeadset [size]="16"></svg><span>IT Service Desk</span></div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="workspace"><span class="workspace-mark">SD</span><span>IT-Support</span></div>
      @if (currentUser(); as user) {
        <div class="user-info">
          <div class="user-avatar" aria-hidden="true">{{ initials() }}</div>
          <div class="user-name"><span>{{ user.full_name }}</span><small>{{ roleLabel() }}</small></div>
          <button type="button" class="icon-button logout-button" (click)="logout()" [disabled]="isLoggingOut()" aria-label="Abmelden" title="Abmelden">
            <svg lucideLogOut [size]="18"></svg>
          </button>
        </div>
      }
    </header>
    <!-- Nur bei Konten eines Demo-Arbeitsbereichs sichtbar (siehe demo-bar.ts). -->
    <app-demo-bar />
    <main class="content" id="main-content" tabindex="-1">
      @if (logoutError()) { <p class="notice notice--error" role="alert">{{ logoutError() }}</p> }
      <router-outlet />
    </main>
  </div>
</div>
